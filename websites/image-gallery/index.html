<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .controls {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 12px 25px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            cursor: pointer;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .filter-btn:hover,
        .filter-btn.active {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .gallery {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            background: white;
        }
        
        .gallery-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        
        .gallery-item-info {
            padding: 15px;
        }
        
        .gallery-item-info h3 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .gallery-item-info p {
            color: #666;
            font-size: 0.9em;
        }
        
        .category-tag {
            display: inline-block;
            padding: 5px 12px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 0.8em;
            margin-top: 10px;
        }
        
        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }
        
        .lightbox-content img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
        }
        
        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 40px;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .lightbox-close:hover {
            color: #667eea;
        }
        
        /* Animation */
        .gallery-item {
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }
            
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🖼️ Image Gallery</h1>
        <p>A Beautiful Collection of Images</p>
    </header>
    
    <div class="controls">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="city">City</button>
        <button class="filter-btn" data-filter="people">People</button>
        <button class="filter-btn" data-filter="food">Food</button>
    </div>
    
    <div class="gallery" id="gallery"></div>
    
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
            <img id="lightbox-img" src="" alt="">
        </div>
    </div>
    
    <script>
        // Sample image data (using placeholder images)
        const images = [
            { id: 1, title: 'Mountain Sunset', category: 'nature', url: 'https://picsum.photos/400/300?random=1' },
            { id: 2, title: 'City Skyline', category: 'city', url: 'https://picsum.photos/400/300?random=2' },
            { id: 3, title: 'Portrait', category: 'people', url: 'https://picsum.photos/400/300?random=3' },
            { id: 4, title: 'Delicious Meal', category: 'food', url: 'https://picsum.photos/400/300?random=4' },
            { id: 5, title: 'Forest Path', category: 'nature', url: 'https://picsum.photos/400/300?random=5' },
            { id: 6, title: 'Urban Street', category: 'city', url: 'https://picsum.photos/400/300?random=6' },
            { id: 7, title: 'Beach Waves', category: 'nature', url: 'https://picsum.photos/400/300?random=7' },
            { id: 8, title: 'Sushi Plate', category: 'food', url: 'https://picsum.photos/400/300?random=8' },
            { id: 9, title: 'Friends Together', category: 'people', url: 'https://picsum.photos/400/300?random=9' },
            { id: 10, title: 'Night City', category: 'city', url: 'https://picsum.photos/400/300?random=10' },
            { id: 11, title: 'Garden Flowers', category: 'nature', url: 'https://picsum.photos/400/300?random=11' },
            { id: 12, title: 'Gourmet Dessert', category: 'food', url: 'https://picsum.photos/400/300?random=12' }
        ];
        
        let currentFilter = 'all';
        
        // Render gallery
        function renderGallery(filter = 'all') {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            const filteredImages = filter === 'all' 
                ? images 
                : images.filter(img => img.category === filter);
            
            filteredImages.forEach(image => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    <img src="${image.url}" alt="${image.title}" onclick="openLightbox('${image.url}')">
                    <div class="gallery-item-info">
                        <h3>${image.title}</h3>
                        <p>Click to view larger</p>
                        <span class="category-tag">${image.category}</span>
                    </div>
                `;
                gallery.appendChild(item);
            });
        }
        
        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderGallery(currentFilter);
            });
        });
        
        // Lightbox functions
        function openLightbox(imageUrl) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imageUrl;
            lightbox.classList.add('active');
        }
        
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
        
        // Close lightbox on background click
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });
        
        // Close lightbox with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });
        
        // Initial render
        renderGallery();
    </script>
</body>
</html>
